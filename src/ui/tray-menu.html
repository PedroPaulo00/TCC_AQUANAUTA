<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Frutiger';
      src: local('Frutiger'), url('../../assets/fonts/Frutiger.woff') format('woff');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width:  210px;
      height: 98px;
      background: transparent;
      overflow: hidden;
      font-family: 'Frutiger', 'Segoe UI', 'SegoeUI', sans-serif;
      -webkit-app-region: no-drag;
      user-select: none;
      -webkit-user-select: none;
    }

    /* padding lateral dá espaço pro shadow vazar */
    .wrapper {
      width: 100%;
      height: 100%;
      padding: 6px;
      display: flex;
      flex-direction: column;
    }

    /* painel de vidro principal */
    .menu {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      padding: 5px;

      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.78)  0%,
          rgba(255, 255, 255, 0.40) 22%,
          rgba(255, 255, 255, 0.04) 44%,
          transparent               46%
        ),
        linear-gradient(180deg,
          rgba(200, 228, 255, 0.72)  0%,
          rgba(172, 210, 255, 0.60) 52%,
          rgba(148, 196, 255, 0.68) 100%
        ),
        linear-gradient(0deg,
          rgba(110, 185, 255, 0.20)  0%,
          transparent               35%
        );

      border-top:    1px solid rgba(255, 255, 255, 0.92);
      border-left:   1px solid rgba(255, 255, 255, 0.72);
      border-right:  1px solid rgba(160, 205, 250, 0.42);
      border-bottom: 1px solid rgba(130, 185, 245, 0.36);

      box-shadow:
        0  16px 50px rgba(0,   0,   0, 0.62),
        0   3px 10px rgba(0,   0,   0, 0.40),
        inset 0  1px  0 rgba(255, 255, 255, 1.00),
        inset 0  2px  6px rgba(255, 255, 255, 0.32),
        0   0   0 1px rgba(90,  170, 255, 0.20),
        0   0  20px rgba(80,  160, 255, 0.12);

      animation: menu-in 0.13s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes menu-in {
      from { opacity: 0; transform: scale(0.91) translateY(7px); }
      to   { opacity: 1; transform: scale(1.00) translateY(0px); }
    }

    /* textura de linhas finas estilo aero */
    .menu::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.028) 2px,
        rgba(255, 255, 255, 0.028) 3px
      );
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
    }

    /* reflexo de luz vindo de baixo */
    .menu::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 28%;
      background: linear-gradient(0deg,
        rgba(100, 180, 255, 0.22),
        transparent
      );
      border-radius: 0 0 9px 9px;
      pointer-events: none;
      z-index: 0;
    }

    /* itens do menu */
    .item {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 7px 12px 7px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #0b0b0b;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
      z-index: 1;
      transition: border-color 110ms ease, box-shadow 110ms ease, color 80ms ease;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    /* gloss overlay — aparece só no hover */
    .item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 52%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.62) 0%,
        rgba(255, 255, 255, 0.05) 100%
      );
      border-radius: 5px 5px 0 0;
      opacity: 0;
      transition: opacity 110ms ease;
      pointer-events: none;
    }

    .item:hover {
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.72)  0%,
        rgba(215, 255,  58, 0.52) 28%,
        rgba(138, 230,  10, 0.40) 66%,
        rgba( 90, 198,   5, 0.50) 100%
      );
      border-color: rgba(148, 255, 45, 0.65);
      box-shadow:
        inset 0  1px  0 rgba(255, 255, 255, 0.92),
        inset 0 -2px  8px rgba( 50, 162,  0, 0.30),
        0     1px  6px rgba( 90, 218, 10, 0.26),
        0     0   14px rgba(110, 255, 28, 0.14);
      color: #000;
    }
    .item:hover::before { opacity: 1; }

    .item:active { transform: translateY(1px); }

    .icon-orb {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .item-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0,30,120,0.30));
    }

    /* separador duplo estilo vista */
    .sep {
      position: relative;
      height: 1px;
      margin: 4px 8px;
      z-index: 1;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba( 80, 140, 215, 0.60) 15%,
        rgba( 80, 140, 215, 0.68) 50%,
        rgba( 80, 140, 215, 0.60) 85%,
        transparent 100%
      );
    }
    .sep::after {
      content: '';
      position: absolute;
      top: 1px; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(255, 255, 255, 0.72) 15%,
        rgba(255, 255, 255, 0.80) 50%,
        rgba(255, 255, 255, 0.72) 85%,
        transparent
      );
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="menu">

      <div class="item" id="item-open">
        <div class="icon-orb">
          <img class="item-icon" src="../../assets/icons/app.png" alt="">
        </div>
        <span>Abrir Aquanauta</span>
      </div>

      <div class="sep"></div>

      <div class="item" id="item-quit">
        <span style="padding-left: 28px;">Sair</span>
      </div>

    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    document.getElementById('item-open').addEventListener('click', () => {
      ipcRenderer.send('tray-menu-open');
    });
    document.getElementById('item-quit').addEventListener('click', () => {
      ipcRenderer.send('tray-menu-quit');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') window.close();
    });
  </script>
</body>
</html>
